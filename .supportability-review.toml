schema_version = "1.0"

[behavior]
intended_behavior = "The temporary exported s03ComplexityCanary provides a static TypeScript/TSX Gate 1 qualification target at the approved maximum complexity of 10 without being called by product code."
proof = "The changed function contains nine decision branches plus the base path, is covered by the existing a1-workout-v1 characterization scenario, and exists only on a protected never-merge canary PR."

[characterization]
captured_behavior = "Existing WorkoutTracer behavior remains unchanged because no product caller references s03ComplexityCanary."
proof = "The existing a1-workout-v1 scenario covers src/WorkoutTracer.tsx; hosted characterization and quality evidence must remain compatible on the exact canary head."

[separation_of_concerns]
before = "Gate 1 frontend qualification had no disposable changed TypeScript/TSX function in this target repository."
after = "One uncalled exported function owns only the temporary static complexity qualification signal; existing workout components remain unchanged."

[architecture]
dependency_direction = "The canary adds no imports, calls, packages, runtime dependencies, or dependency-direction changes."
reviewed_paths = [
    ".supportability-review.toml",
    "src/WorkoutTracer.tsx",
]

[responsibility_boundary]
path = "src/WorkoutTracer.tsx"
owns = "The disposable s03ComplexityCanary function used for static Gate 1 qualification on this never-merge PR."
does_not_own = "Workout behavior, Gate implementation, thresholds, dependencies, or permanent product capability."

[incremental_refactor]
target = "Qualify the TypeScript/TSX complexity threshold on a disposable protected target branch."
completed_step = "Add one bounded uncalled function at complexity 10 for the valid canary head."

[review_handoff]
summary = "Review only the disposable s03ComplexityCanary and its evidence metadata: valid head has TypeScript/TSX complexity 10, no caller, no product behavior change, and no threshold, dependency, exclusion, or waiver change."
remaining_risks = [
    "This artificial function proves static threshold enforcement only; it is not product functionality.",
    "The canary PR must remain unmerged and all disposable refs and protection must be deleted after evidence capture.",
]

[human_review]
naming = "s03ComplexityCanary identifies the exact milestone and qualification purpose."
cohesion = "One function contains the complete temporary Gate 1 signal; no existing component responsibility changes."
intended_behavior = "Gate 1 passes this exact complexity-10 head while Gates 2 through 8 remain independently green."
reviewability = "The production diff is one exported uncalled function with nine visible branches and one terminal return."
