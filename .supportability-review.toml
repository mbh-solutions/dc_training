schema_version = "1.0"

[behavior]
intended_behavior = "After one legacy upgrade, every current signed-in device may edit without an edit-access transfer warning. A device queue commits as one account-revision batch or not at all; stale or rejected work remains reviewable until the owner explicitly chooses cloud data."
proof = "Production evidence established that the original first transfer already succeeded server-side and the second click was redundant. The replacement removes transfer from the current client, adds an atomic activation/takeover RPC, persists one stable batch ID and base revision with the local queue, checks the receipt before revision CAS, applies all operations inside one rollback boundary, deletes local operations only after an applied receipt and stable cloud snapshot, and freezes preserved conflicts. The focused owner-shell test passed 1/1 and its directly relevant suite passed 2/2. Production owner-device qualification remains required after merge, migration, and deployment."

[characterization]
captured_behavior = "The qualified auth shell, rotation setup, workout runtime, logbook, history, blast/cruise, offline working copy, account lifecycle, and backups remain. Legacy single-writer authority now exists only as a guarded rollout fence until revision-mode activation; no training rule changes."
proof = "Existing characterization definitions and goldens remain byte-identical to main. The forward migration compiled against production inside an explicit rollback transaction; the result was rollback_compile_ok, and a follow-up catalog query confirmed that neither account_revision nor private.offline_batches remained."

[separation_of_concerns]
before = "S09 qualified authentication recovery, cloud persistence, temporary offline use, and one active editing device, but it had no owner deletion lifecycle or operational backup."
after = "FoundationHome and HomeScreen own upgrade/conflict presentation. use-offline-sync owns React scheduling and frozen conflict state. offline-sync owns IndexedDB batch identity, stable snapshots, acknowledgement, and guarded recovery. The additive migration owns atomic activation, account revision CAS, durable receipts, legacy cutover, and RPC privileges."

[architecture]
dependency_direction = "Screens delegate edits and recovery choices through FoundationHome to use-offline-sync. The hook delegates persistence and transport to offline-sync. offline-sync calls uniquely named authenticated RPCs; the migration terminates trust at auth.uid, live-account checks, the owner lock, account revision CAS, and private receipt tables. Legacy per-operation RPCs reject new writes after activation."
