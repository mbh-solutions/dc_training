schema_version = "1.0"

[behavior]
intended_behavior = "After one successful owner sign-in and data load, routine training remains usable through temporary connectivity loss. Every change commits an account-bound IndexedDB working copy and a stable ordered operation in one transaction, then synchronizes immediately, on reconnect, or on foreground through one idempotent cloud boundary. The UI reports OFFLINE, SYNCING, SYNCED, or SYNC FAILED and offers Try Again without discarding queued work."
proof = "A targeted native-IndexedDB Chromium run against the actual React application proves online hydration from canonical Postgres target JSON, all four visible sync states, offline Start A1, Skip, Undo, owner isolation, ordered queue records, stable operation identity across full-page reload, simulated 503 retention, Try Again recovery, preserved unsaved workout input across local-to-cloud identity refresh, stable event timestamps, three unique cloud actions, and a drained queue. Focused React probes prove an unsaved history-correction draft survives the same step/workout/assignment ID refresh and an incomplete rotation reports the missing-assignment validation instead of rejecting Start, while a reducer probe proves preserved local step IDs still target their immutable start operation after offline completion and undo. Production rollback-only SQL proves five assignment writes plus start and nine steps, duplicate replay stability, payload-mismatch rejection, fail-closed start/lifecycle context drift, queued local assignment/blast reference resolution, preserved assignment/workout event times, event-time-correct cruise suggestion, nine authoritative step writes, one completed workout, exactly one A1-to-B1 rotation advance, and zero residue. Focused reducer probes prove blast-boundary logbook reset and current-blast lookup by immutable blast identity despite device-clock skew. The focused foundation runtime and production build/lint commands verify the directly relevant application boundary."

[characterization]
captured_behavior = "The qualified auth shell, rotation setup, six-slot workout runtime, logbook enforcement, history correction, and blast/cruise lifecycle remain; S08 replaces routine cloud-only mutations with one durable offline working-copy and synchronization seam while retaining online-only sign-in, sign-out, recovery, deletion, and active-device transfer boundaries."
proof = "Existing foundation-shell-v2, rotation-setup-v1, a1-workout-v1, history-v1, and blast-cruise-v1 definitions remain immutable and reproduce their golden behavior. Additive offline-sync-v1 returns the same compatible surface result on the S07 base and S08 head while covering every S08 production path; the focused React helpers seed the qualified prior online load and exercise the queued client seam."

[separation_of_concerns]
before = "S07 React hooks called individual Supabase mutation RPCs and disabled routine changes whenever navigator.onLine was false."
after = "UI hooks submit typed local operations; HistoryScreen retains semantic selection identity across authoritative refreshes; offline-sync alone owns IndexedDB state reduction, ordering, account logbook hydration, draft-safe cloud identity reconciliation, immutable-blast performance lookup, cloud replay, and authoritative refresh; use-offline-sync alone schedules foreground/reconnect retries and exposes status; the migrations own cross-retry cloud idempotency, local-step/reference resolution, start/lifecycle-context validation, and stable event-time preservation."

[architecture]
dependency_direction = "App authenticates one owner; FoundationHome composes use-offline-sync; workout, rotation, and history hooks submit typed operations without direct cloud writes; offline-sync persists account state plus stable operation/event/context identity and calls only apply_offline_operation; the public RPC validates queued start and lifecycle snapshots, dispatches to established authoritative functions, preserves user event time, and records results in a private ledger. Cache Storage remains owned by the existing Vite PWA configuration."
reviewed_paths = [
    "src/App.tsx",
    "src/FoundationHome.tsx",
    "src/HistoryScreen.tsx",
    "src/HomeScreen.tsx",
    "src/RotationSetup.tsx",
    "src/hooks/use-offline-sync.ts",
    "src/hooks/use-foundation-profile.ts",
    "src/hooks/use-owner-access.ts",
    "src/hooks/use-rotation-assignment.ts",
    "src/hooks/use-workout.ts",
    "src/offline-sync.ts",
    "src/rotation-assignment.ts",
    "src/workout-api.ts",
    "src/workout-domain.ts",
    "supabase/migrations/20260810192528_offline_operation_queue.sql",
    "supabase/migrations/20260810211000_preserve_offline_event_time.sql",
    "supabase/migrations/20260810214500_validate_offline_replay_context.sql",
    "supabase/migrations/20260810222500_validate_offline_lifecycle_context.sql",
    "supabase/migrations/20260810223500_fix_offline_blast_reference_resolution.sql",
    "tests/a1-assignment.e2e.mjs",
    "tests/history.test.mjs",
    "tests/characterization/foundation-shell.characterization.mjs",
    "tests/characterization/offline-sync-v1.characterization.mjs",
    "tests/characterization/offline-sync-v1.golden.json",
    ".supportability-characterization.json",
]

[responsibility_boundary]
path = "src/offline-sync.ts"
owns = "Account-keyed durable working state, ordered operation records, atomic local commits, deterministic optimistic reducers, retry replay, local-step targeting, and post-drain authoritative refresh."
does_not_own = "Authentication, PWA shell caching, background execution after close, active-device transfer, merge/conflict policy, database authorization, or Supportability Gate behavior."

[incremental_refactor]
target = "Add only S08 temporary-offline routine training and exactly-once synchronization to the qualified S07 app."
completed_step = "Reused the existing PWA precache; extracted the shared assignment shape; added one native IndexedDB module, one small scheduling hook, narrow consumer rewiring, one private-ledger dispatcher migration, and four forward repairs preserving stable event time plus validating replay context. No package, active-device, background-sync, conflict-resolution, or Supportability Gate change."

[review_handoff]
summary = "Review atomic IndexedDB state-plus-operation commits, strict user keys, semantic assignment-target hydration, stable operation replay, step resolution by start-operation plus ordinal, ordered drain/refresh races, retry states, established RPC delegation, private ledger privileges, and preservation of online-only account boundaries."
remaining_risks = [
    "S08 intentionally synchronizes only while the app is open or returns to foreground; background execution after close is excluded.",
    "S09 must add the separately approved one-active-editing-device transfer boundary before multiple devices may edit.",
]

[human_review]
naming = "OFFLINE, SYNCING, SYNCED, SYNC FAILED, Try Again, and Saved on device match the locked S08 product ledger."
cohesion = "Presentation, scheduling, durable local state, cloud transport, and authoritative database mutation remain separate."
intended_behavior = "The signed-in owner can train, correct history, edit assignments, complete workouts, and change blast/cruise state during temporary connectivity loss without duplicate cloud effects."
reviewability = "One client persistence module, one scheduling hook, narrow existing-hook rewiring, five forward-only migrations, and one additive compatibility characterization implement and prove S08; no package was added."

