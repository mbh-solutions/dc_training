schema_version = "1.0"

[behavior]
intended_behavior = "A read-only mobile device transfers edit access after one in-app confirmation. The warning no longer opens a native browser dialog that foregrounds and remounts the app; the transfer also waits for any synchronization already in progress, then atomically claims authority and reloads cloud state. A second confirmation is not required."
proof = "A focused hook race probe starts a failing read-only foreground synchronization before transfer, clears the stale local queue, and proves the first transfer call still claims authority once and finishes active. A focused rendered-UI probe proves the in-app warning calls transfer once without invoking the native confirmation API. The directly relevant foundation test and changed-file oxlint pass once."

[characterization]
captured_behavior = "The qualified auth shell, rotation setup, workout runtime, logbook, history, blast/cruise, offline working copy, and active-device transfer remain. S10 adds an account-status gate, deletion/recovery controls, local purge, authoritative cloud lifecycle, and encrypted operational backup without changing any training rule."
proof = "Existing characterization definitions and goldens remain byte-identical to main, and foundation-shell-v2 reproduced its exact golden locally. The rollback-only S10 production-schema compile supplies additive lifecycle proof without changing the established driver."

[separation_of_concerns]
before = "S09 qualified authentication recovery, cloud persistence, temporary offline use, and one active editing device, but it had no owner deletion lifecycle or operational backup."
after = "HomeScreen exposes the existing gear as a real button; SettingsScreen owns the approved settings presentation; offline-sync reuses its ordered device-local queue for the preference; weight-conversion owns canonical display conversion; the additive migration alone owns durable profile storage and active-device authorization. Existing deletion and backup boundaries are unchanged."

[architecture]
dependency_direction = "HomeScreen opens SettingsScreen through FoundationHome. SettingsScreen delegates changes to the existing offline queue; offline-sync owns local reduction, ordered replay, and profile hydration; weight-conversion owns canonical display conversion; save_weight_unit terminates trust at auth.uid, account availability, the owner lock, and the private active-device row. Existing deletion and backup boundaries remain unchanged."
