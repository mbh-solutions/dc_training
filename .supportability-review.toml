schema_version = "1.0"

[behavior]
intended_behavior = "After each saved exercise performance, apply the locked protocol-aware verdict, block unresolved abs/failure decisions, permit one mulligan, require replacement after the post-mulligan failure, and preserve retired performance history behind a fresh reassignment baseline."
proof = "tests/logbook-enforcement.test.mjs covers the locked table-driven verdict boundaries and deterministic retries. tests/a1-assignment.e2e.mjs mounts src/main.tsx with React and captures win, exact first-failure choices, pending-decision undo, mulligan marking, replacement-only enforcement, visible replacement failures, matching-category replacement, operation retries, and every historically formatted returned-exercise performance behind a fresh baseline. Rollback-only database proof denies authenticated writes across every assignment/workout/logbook lifecycle table while trusted owner-checking RPCs retain authority."

[characterization]
captured_behavior = "The qualified auth/offline shell, full rotation setup, and six-slot workout runtime remain while a1-workout-v1 continues to fail closed on the established compatibility RPC and workout surface contracts."
proof = "The existing foundation-shell-v2, rotation-setup-v1, and a1-workout-v1 characterization definitions remain unchanged; the directly relevant real-React runtime proof is extended instead of replaced."

[separation_of_concerns]
before = "The S04 boundaries persisted complete workouts and previous performance but deliberately deferred logbook verdicts and replacement enforcement."
after = "workout-domain owns row validation plus deterministic client-side truth-table proof; WorkoutTracer owns verdict and blocking presentation; useWorkout owns retry-stable React transitions; workout-api owns validated RPC calls; and the forward-only migration owns authoritative transactional verdict, lifecycle, replacement, correction, read-only table access, and RLS invariants."

[architecture]
dependency_direction = "App composes FoundationHome; FoundationHome composes RotationSetup, WorkoutTracer, and useWorkout; useWorkout delegates cloud I/O to workout-api; workout-api alone reaches Supabase; workout-domain validates rows and expresses the locked comparison rules for targeted proof; the database remains authoritative."
reviewed_paths = [
    "supabase/migrations/20260810100806_enforce_logbook_rules.sql",
    "src/FoundationHome.tsx",
    "src/RotationSetup.tsx",
    "src/RotationSetupView.tsx",
    "src/WorkoutTracer.tsx",
    "src/hooks/use-rotation-editor.ts",
    "src/hooks/use-rotation-flow.ts",
    "src/hooks/use-workout.ts",
    "src/workout-api.ts",
    "src/workout-domain.ts",
    "tests/logbook-enforcement.test.mjs",
    "tests/a1-assignment.e2e.mjs",
]

[responsibility_boundary]
path = "supabase/migrations/20260810100806_enforce_logbook_rules.sql"
owns = "Canonical-weight comparisons, per-assignment lifecycle state, blocking decisions, idempotent replacement, historical recalculation, read-only owner-scoped RLS, and trusted owner-checking mutation RPCs."
does_not_own = "Workout visuals, general rotation editing, history screens, cruise timing, or offline mutation queuing."

[incremental_refactor]
target = "Add only S05 logbook enforcement to the qualified S04 workout boundaries."
completed_step = "Extended existing step rows and RPCs forward-only, reused the rotation editor for category-safe replacement, and retained the compatibility workout RPC names."

[review_handoff]
summary = "Review locked verdict truth tables, blocking action cardinality, fresh-baseline history separation, transactional operation IDs, correction recalculation, owner isolation, and the real-React lifecycle capture."
remaining_risks = [
    "Historical correction recalculation is enforced by the database API; a history/correction screen is intentionally outside S05.",
    "Offline mutation queuing remains intentionally deferred; confirmed cloud actions resume after reconnect.",
]

[human_review]
naming = "Logbook verdict, enforcement action, resolution, mulligan, replacement, and fresh-baseline names match the locked product ledger."
cohesion = "Presentation, React state, cloud I/O, row validation, pure comparison proof, and authoritative persistence remain separate."
intended_behavior = "The owner receives deterministic verdicts and cannot proceed past an unresolved logbook decision; replacement changes future assignments without deleting the failed performance."
reviewability = "One forward migration, focused pure domain logic/test, narrow extensions to established workout/rotation boundaries, and one extended actual-React runtime packet cover S05 only."

[[module_boundaries]]
path = "src/WorkoutTracer.tsx"
owner_path = "src/WorkoutTracer.tsx"
basis = "responsibility"
justification = "Owns win/baseline visibility, comparison tables, blocking sheets, mulligan badges, and returned-history presentation only."

[[module_boundaries]]
path = "src/hooks/use-workout.ts"
owner_path = "src/hooks/use-workout.ts"
basis = "responsibility"
justification = "Owns retry-stable save, resolution, replacement, completion, and React state transitions only."

[[module_boundaries]]
path = "src/workout-api.ts"
owner_path = "src/workout-api.ts"
basis = "responsibility"
justification = "Owns validated owner-filtered workout, logbook-decision, and replacement Supabase calls only."

[[module_boundaries]]
path = "src/workout-domain.ts"
owner_path = "src/workout-domain.ts"
basis = "responsibility"
justification = "Owns fail-closed validation for extended workout rows plus the locked pure comparison truth tables; it performs no I/O or React state."

[[module_boundaries]]
path = "src/RotationSetup.tsx"
owner_path = "src/RotationSetup.tsx"
basis = "responsibility"
justification = "Reuses the established assignment editor for a current-exercise-excluded, matching-category replacement path."

[[module_boundaries]]
path = "supabase/migrations/20260810100806_enforce_logbook_rules.sql"
owner_path = "supabase/migrations/20260810100806_enforce_logbook_rules.sql"
basis = "responsibility"
justification = "Owns authoritative transactional comparison, lifecycle, future-only replacement, correction recalculation, idempotency, read-only RLS exposure, and trusted owner-checking mutation RPCs."
