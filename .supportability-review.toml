[architecture]
dependency_direction = "Presentation calls existing workout hooks; hooks submit offline operations; the reducer and SQL functions implement persistence while shared domain helpers calculate scores. PGlite is test-only."
reviewed_paths = ["src/FoundationHome.tsx", "src/HistoryScreen.tsx", "src/HomeScreen.tsx", "src/RotationSetupView.tsx", "src/WorkoutTracer.tsx", "src/hooks/use-rotation-assignment.ts", "src/hooks/use-rotation-editor.ts", "src/hooks/use-workout.ts", "src/offline-sync.ts", "src/rotation-assignment-draft.ts", "src/rotation-assignment.ts", "src/rotation-config.ts", "src/weight-conversion.ts", "src/workout-domain.ts"]

[responsibility_boundary]
path = "src/workout-domain.ts"
owns = "Pure performance comparison and data-shape validation."
does_not_own = "React navigation, device storage, authentication, cloud RPCs, or deployment."

[incremental_refactor]
target = "Separate exercise identity from workout-slot history and make workout prescriptions visible."
completed_step = "Keep persisted historical assignments intact while adapting new workout composition, comparison logic, presentation and corresponding cloud functions together."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Names distinguish compatible performance history, load type, estimated score and per-assignment enforcement."
cohesion = "UI helpers own display and controls; validation and scoring stay in domain modules; offline reducer and SQL implement matching state transitions."
intended_behavior = "Owner-requested updates preserve saved history, synchronize exercise baselines across workout slots, and use estimated strength for weighted logbook and mulligan decisions."
reviewability = "Production changes are accompanied by targeted runtime and database checks. The owner separately authorized removing AGENTS.md. The database migration must be applied before clients use new load types and presets."
