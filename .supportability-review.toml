schema_version = "1.0"

[behavior]
intended_behavior = "Preserve the qualified owner foundation and let the authenticated owner configure every locked A/B rotation slot plus the six fixed abs slots with explicit exercise, protocol, structure, review, replacement lineage, and restored state without starting a workout."
proof = "tests/a1-assignment.e2e.mjs mounts the real React application and drives A1 rest-pause, B1 custom straight sets, timed abs, review/back/save/edit/reload, calf information-sheet dismissal, and remount restoration; tests/rotation-config.test.mjs verifies the complete locked order, pools, mappings, badges, and display labels."

[characterization]
captured_behavior = "The foundation behaviors remain and the owner can configure and restore all 36 locked rotation and abs assignments without preselected choices."
proof = "The registered characterization preserves the qualified foundation behavior; tests/a1-assignment.e2e.mjs mounts src/main.tsx and verifies the S02 setup flow, while tests/rotation-config.test.mjs verifies every locked configuration entry and mapping."

[separation_of_concerns]
before = "App owned session lifecycle, network listeners, profile authorization, route selection, and Home presentation; the Supabase module also parsed callback URLs."
after = "App still selects authentication versus the signed-in surface; focused modules separately own signed-in surface selection, Home rendering, assignment client validation and calls, editor state, and flow rendering."

[architecture]
dependency_direction = "src/main.tsx mounts App; App composes authentication and FoundationHome; FoundationHome selects HomeScreen or RotationSetup; RotationSetup composes focused editor-state, navigation, draft, presentation, and assignment boundaries; only the assignment hook reaches the Supabase client."
reviewed_paths = [
    "src/RotationSetup.tsx",
    "src/RotationSetupFlow.tsx",
    "src/RotationSetupView.tsx",
    "src/hooks/use-rotation-editor.ts",
    "src/hooks/use-rotation-flow.ts",
    "src/hooks/use-rotation-assignment.ts",
    "src/rotation-assignment-draft.ts",
    "src/rotation-config.ts",
]

[responsibility_boundary]
path = "src/rotation-config.ts"
owns = "The fixed S02 rotation order, choices, mappings, badges, and instructional copy."
does_not_own = "React state, rendering, Supabase calls, database policy, or workout execution."

[incremental_refactor]
target = "Correct the exact semantic findings without expanding the product scope."
completed_step = "Expanded the existing setup flow and data boundary to the complete locked A/B rotation and six abs slots, using one fixed config module and one versioned save RPC."

[review_handoff]
summary = "Review the fixed rotation config, existing editor/view boundary, owner-scoped serialized assignment hook, three additive migrations, and real React characterization."
remaining_risks = [
    "The retained legacy assignment table is temporary rollback compatibility and should be removed only after the new contract is proven in production.",
]

[human_review]
naming = "The changed config, setup component, controlled view, and assignment hook name their direct responsibilities."
cohesion = "The config contains fixed choices; the draft module derives valid targets; focused hooks own editor state and navigation; RotationSetup wires save orchestration; RotationSetupFlow routes screens; RotationSetupView presents them; the assignment hook owns validated cloud calls."
intended_behavior = "Qualified owner foundation remains; authenticated owner gains the complete fixed S02 rotation and abs setup with durable replacement history."
reviewability = "The change reuses the existing setup modules, adds one fixed config module, three additive migrations, and focused checks; no dependency or workout execution model was added."

[[module_boundaries]]
path = "src/RotationSetup.tsx"
owner_path = "src/RotationSetup.tsx"
basis = "responsibility"
justification = "Owns setup-boundary composition and save orchestration while delegating editor state, edit hydration, navigation, draft validation, routing, fixed data, persistence, and rendering."

[[module_boundaries]]
path = "src/RotationSetupFlow.tsx"
owner_path = "src/RotationSetupFlow.tsx"
basis = "responsibility"
justification = "Owns setup-screen route selection only and delegates every screen's presentation."

[[module_boundaries]]
path = "src/RotationSetupView.tsx"
owner_path = "src/RotationSetupView.tsx"
basis = "responsibility"
justification = "Owns controlled rotation and abs setup presentation only."

[[module_boundaries]]
path = "src/hooks/use-rotation-editor.ts"
owner_path = "src/hooks/use-rotation-editor.ts"
basis = "responsibility"
justification = "Owns rotation editor field state, selection mutations, and saved-assignment hydration only."

[[module_boundaries]]
path = "src/hooks/use-rotation-flow.ts"
owner_path = "src/hooks/use-rotation-flow.ts"
basis = "responsibility"
justification = "Owns the setup screen state and navigation transitions only."

[[module_boundaries]]
path = "src/hooks/use-rotation-assignment.ts"
owner_path = "src/hooks/use-rotation-assignment.ts"
basis = "responsibility"
justification = "Owns returned-row validation, loading, and versioned persistence of the current owner's rotation assignments."

[[module_boundaries]]
path = "src/rotation-assignment-draft.ts"
owner_path = "src/rotation-assignment-draft.ts"
basis = "responsibility"
justification = "Owns editable-target conversion, numeric target validation, and assignment-draft derivation."

[[module_boundaries]]
path = "src/rotation-config.ts"
owner_path = "src/rotation-config.ts"
basis = "responsibility"
justification = "Owns the fixed S02 order, exercise pools, protocols, structure choices, muscle mappings, badges, and protocol information copy."
