schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Apply the approved workout polish: RP1/RP2/RP3, responsive inputs, live total, previous-load defaults, persistent drafts, accessible dialogs, load-type corrections, consolidated history, visible unit-save failures and shared consecutive-failure enforcement."
proof = "43 isolated UI/reducer audit checks, existing runtime suites, PGlite cross-slot failure/undo/win tests, production build, lint and browser checks at 320/360/390/430 CSS pixels."

[characterization]
captured_behavior = "Preserve workout saves, historical corrections and rotation editing on base and head while extending real workflow coverage to the draft and dialog modules."
proof = "Existing characterization outputs are unchanged; new targeted tests reproduce the audited defects and retain the established win-clears-mulligan rule."

[separation_of_concerns]
before = "Workout entries were transient; dialogs left background controls reachable; exercise history and failure state were split by assignment."
after = "Draft storage and focus containment have separate owners. Shared exercise history drives compatible failure sequences, while presentation handles entry feedback and correction controls."

