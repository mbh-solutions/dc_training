schema_version = "1.0"

[behavior]
intended_behavior = "Authenticated owners can browse current, retired, in-progress, and completed history; inspect protocol-specific progression; and correct a saved performance while affected verdicts recalculate without changing assignments or advancing rotation."
proof = "tests/history.test.mjs covers deterministic workout, body-part, slot, retired/reactivated ordering and poisons the correction function for rotation or assignment mutation. tests/a1-assignment.e2e.mjs mounts src/main.tsx with React and captures both tabs, one-open grouping, search, workout detail, every chart variant, original units, reassignment separation, retired history, correction, recalculated verdict, and unchanged rotation advancement count. Rollback-only production database proof exercises owner-scoped history reads and the established correction RPC with synthetic users only."

[characterization]
captured_behavior = "The qualified auth/offline shell, rotation setup, six-slot workout runtime, and logbook enforcement remain while a1-workout-v1 adds the actual History screen and established correction RPC to its fail-closed surface contract."
proof = "The existing foundation-shell-v2 and rotation-setup-v1 definitions remain unchanged; a1-workout-v1 adds src/HistoryScreen.tsx coverage and its directly relevant real-React runtime packet exercises S06 without replacing earlier behavior."

[separation_of_concerns]
before = "S05 already persisted owner-isolated workout rows and exposed a retry-stable correction RPC with assignment-wide verdict recalculation, but deliberately had no history interface."
after = "workout-domain owns pure history ordering and fail-closed row validation; HistoryScreen owns history navigation, protocol-specific rendering, and correction input; workout-api alone owns owner-filtered Supabase reads and correction RPC validation; the established database function remains authoritative for transactional recalculation."

[architecture]
dependency_direction = "FoundationHome composes HistoryScreen; HistoryScreen delegates cloud I/O to workout-api and pure ordering/validation to workout-domain; workout-api alone reaches Supabase; the existing correction RPC remains the authoritative mutation boundary."
reviewed_paths = [
    "src/FoundationHome.tsx",
    "src/HomeScreen.tsx",
    "src/HistoryScreen.tsx",
    "src/workout-api.ts",
    "src/workout-domain.ts",
    "tests/history.test.mjs",
    "tests/a1-assignment.e2e.mjs",
    "tests/characterization/a1-workout-v1.characterization.mjs",
    ".supportability-characterization.json",
]

[responsibility_boundary]
path = "src/HistoryScreen.tsx"
owns = "History tabs, grouping, search, workout and exercise detail, protocol-specific SVG lanes, reassignment markers, saved-entry presentation, and online correction input."
does_not_own = "Workout logging, rotation advancement, assignment changes, authoritative verdict calculation, database authorization, offline mutation queuing, analytics, or exports."

[incremental_refactor]
target = "Add only S06 history and correction presentation to the qualified S05 persistence boundaries."
completed_step = "Reused the established correction RPC and workout rows, added owner-filtered read calls and pure presentation helpers, and introduced no schema, package, or Supportability Gate change."

[review_handoff]
summary = "Review owner-filtered reads, reactivated-versus-retired grouping, date-aligned canonical charts with original units, disconnected reassignment segments, correction operation IDs, fail-closed responses, and actual-React runtime evidence."
remaining_risks = [
    "Offline history mutation queuing remains explicitly outside S06; corrections are disabled without connectivity.",
    "Charts intentionally use native SVG and the approved single-exercise views; analytics and combined progression scores remain outside scope.",
]

[human_review]
naming = "History, workout, exercise, retired, reassigned, fresh baseline, correction, and verdict labels match the locked product ledger."
cohesion = "Presentation, cloud I/O, pure ordering, row validation, and authoritative transactional correction remain separate."
intended_behavior = "The owner can inspect all required history forms and correct durable performance values without silently changing assignments or replaying rotation advancement."
reviewability = "One new screen, narrow established-boundary extensions, one focused domain/poison test, and one extended actual-React packet cover S06 only."

[[module_boundaries]]
path = "src/HistoryScreen.tsx"
owner_path = "src/HistoryScreen.tsx"
basis = "responsibility"
justification = "Owns S06 history presentation and online correction input only."

[[module_boundaries]]
path = "src/workout-api.ts"
owner_path = "src/workout-api.ts"
basis = "responsibility"
justification = "Owns explicit owner-filtered history reads and validation of the established correction RPC response only."

[[module_boundaries]]
path = "src/workout-domain.ts"
owner_path = "src/workout-domain.ts"
basis = "responsibility"
justification = "Owns pure ordering, retired/reactivated identity, history row validation, and entry-shape rules without I/O or React state."
