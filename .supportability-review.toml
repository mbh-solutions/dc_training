schema_version = "1.0"

[behavior]
intended_behavior = "Authenticated owners can enter cruise from Home without consuming the fixed rotation, reload a read-only Cruise Home with History access, start a new blast at the preserved next slot, establish fresh per-blast exercise baselines, and receive one dismissible seven-week suggestion after workout completion and Home return."
proof = "tests/blast-cruise.test.mjs verifies fail-closed lifecycle shapes and poisons the authoritative SQL transition boundary for rotation mutation, workout deletion, missing owner serialization, missing cruise workout exclusion, missing per-blast tagging, missing fresh-baseline separation, missing one-time dismissal, and missing RLS grants. tests/a1-assignment.e2e.mjs mounts src/main.tsx with React and captures manual confirmation/cancel, retry-stable cruise transition after a lost response, Cruise Home, offline mutation exclusion, History access and return, preserved slot, new blast, same-assignment prior-history guidance with a fresh baseline, completion-gated seven-week suggestion, persistent Not Now dismissal, and unchanged lifecycle rotation. Production rollback-only SQL proof covers before/at/after seven weeks, owner isolation, idempotent transitions, cruise workout rejection, fresh baselines, history preservation, and exact rotation preservation."

[characterization]
captured_behavior = "The qualified auth/offline shell, rotation setup, six-slot workout runtime, logbook enforcement, and history correction remain while blast-cruise-v1 adds the lifecycle seam around the existing fixed rotation."
proof = "The rotation-setup-v1, a1-workout-v1, and history-v1 definitions remain unchanged. The foundation-shell-v2 driver keeps its golden behavior while selecting Sign Out by label after the new outlined Cruise action changed button order. The additive blast-cruise-v1 definition proves the predecessor on base and the S07 schema/UI/runtime contract on head; the directly relevant actual-React packet exercises the complete S07 interaction."

[separation_of_concerns]
before = "S06 persisted the fixed rotation, workout history, and correction semantics but deliberately had no blast or cruise lifecycle."
after = "workout-domain validates lifecycle rows; workout-api alone reads lifecycle state and calls its mutation RPC; use-workout owns retry-stable React lifecycle state; HomeScreen owns confirmation, suggestion, and Cruise Home presentation; the migration alone owns owner serialization, phase invariants, blast clocks, per-blast baselines, suggestion eligibility, and rotation-independent transitions."

[architecture]
dependency_direction = "FoundationHome composes HomeScreen and the workout hook; HomeScreen receives lifecycle state and callbacks without cloud access; use-workout delegates lifecycle I/O to workout-api; workout-api alone reaches Supabase; the database RPC and triggers remain authoritative for concurrency, ownership, rotation preservation, and fresh-baseline enforcement."
reviewed_paths = [
    "src/FoundationHome.tsx",
    "src/HomeScreen.tsx",
    "src/WorkoutTracer.tsx",
    "src/hooks/use-workout.ts",
    "src/workout-api.ts",
    "src/workout-domain.ts",
    "supabase/migrations/20260810163233_add_blast_cruise_lifecycle.sql",
    "supabase/migrations/20260810174144_backfill_migrated_cruise_suggestions.sql",
    "tests/blast-cruise.test.mjs",
    "tests/a1-assignment.e2e.mjs",
    "tests/characterization/blast-cruise-v1.characterization.mjs",
    "tests/characterization/blast-cruise-v1.golden.json",
    "tests/characterization/foundation-shell.characterization.mjs",
    ".supportability-characterization.json",
]

[responsibility_boundary]
path = "supabase/migrations/20260810163233_add_blast_cruise_lifecycle.sql"
owns = "Durable owner lifecycle state, exact phase transition idempotency, blast timestamps, one-time suggestion eligibility, cruise workout exclusion, per-blast baseline selection, and active-blast logbook reconstruction."
does_not_own = "Rotation advancement or reset, assignment changes, prior performance deletion, cruise scheduling, offline mutation queuing, cruise workouts, analytics, or Supportability Gate behavior."

[incremental_refactor]
target = "Add only S07 blast and cruise lifecycle around the qualified S06 rotation and workout boundaries."
completed_step = "Added one owner lifecycle row, an internal idempotency ledger, one lifecycle RPC, narrow insert/status triggers, a blast-aware replacement of the established recalculation function, and small state/presentation extensions; no package or Supportability Gate change."

[review_handoff]
summary = "Review owner locking and RLS, operation-ID replay, no rotation writes in lifecycle transitions, cruise workout exclusion, stopped blast clock, completion-gated seven-week eligibility, persistent per-blast dismissal, new-blast logbook reset without history deletion, and actual-React runtime evidence."
remaining_risks = [
    "Offline lifecycle mutations remain explicitly outside S07; phase actions are disabled without connectivity.",
    "Cruise remains deliberately manual with no duration, reason, countdown, scheduling, or cruise workout logging.",
]

[human_review]
naming = "Start Cruise, Recovery, paused rotation, preserved next workout, Start New Blast, seven weeks, Consider a Cruise, Not Now, and fresh baseline labels match the locked product ledger."
cohesion = "Presentation, React state, cloud I/O, row validation, and authoritative transactional lifecycle logic remain separate."
intended_behavior = "The owner controls cruise and new-blast transitions without losing rotation position or history, while the database prevents cruise workouts and old-blast failures from leaking into the new blast."
reviewability = "Two forward-only migrations, narrow established-boundary extensions, one focused contract test, one additive characterization, and one extended actual-React packet cover S07 only."

[[module_boundaries]]
path = "src/HomeScreen.tsx"
owner_path = "src/HomeScreen.tsx"
basis = "responsibility"
justification = "Owns Home lifecycle actions, approved bottom sheets, and read-only Cruise Home presentation only."

[[module_boundaries]]
path = "src/hooks/use-workout.ts"
owner_path = "src/hooks/use-workout.ts"
basis = "responsibility"
justification = "Owns client lifecycle state, retry-stable operation IDs, and post-completion Home refresh without database policy."

[[module_boundaries]]
path = "src/workout-api.ts"
owner_path = "src/workout-api.ts"
basis = "responsibility"
justification = "Owns validated lifecycle reads and the single lifecycle RPC call without presentation or transition rules."

[[module_boundaries]]
path = "src/workout-domain.ts"
owner_path = "src/workout-domain.ts"
basis = "responsibility"
justification = "Owns the fail-closed lifecycle row shape without I/O or React state."

[[module_boundaries]]
path = "supabase/migrations/20260810163233_add_blast_cruise_lifecycle.sql"
owner_path = "supabase/migrations/20260810163233_add_blast_cruise_lifecycle.sql"
basis = "responsibility"
justification = "Owns durable lifecycle invariants, authorization, concurrency, idempotency, blast-aware baselines, and suggestion timing without changing rotation state."

[[module_boundaries]]
path = "supabase/migrations/20260810174144_backfill_migrated_cruise_suggestions.sql"
owner_path = "supabase/migrations/20260810174144_backfill_migrated_cruise_suggestions.sql"
basis = "responsibility"
justification = "Owns the forward-only eligibility repair for completed workouts migrated into the initial blast without changing dismissal or rotation state."
