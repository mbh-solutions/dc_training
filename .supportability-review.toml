schema_version = "1.0"

[behavior]
intended_behavior = "The active editing device can request owner-account deletion only after password re-entry and an explicit permanent-deletion acknowledgement. A successful request clears the current device, globally signs out, and makes owner data unavailable for exactly 30 days; authenticated recovery exposes only status, cancellation, password recovery, and sign-out. Expired requests are finalized by a database scheduler that deletes auth.users and relies on established cascading owner foreign keys. A daily GitHub Actions workflow uploads only a GPG-encrypted logical Supabase dump, verifies it before upload, surfaces failures, and expires every artifact after 30 days."
proof = "The existing foundation-shell-v2 characterization reproduces the qualified auth, PWA, offline, and training shell unchanged. Production oxlint and tsc/Vite PWA build passed once. Rollback-only production-schema compilation created the backup role, request table, guards, restrictive RLS policies, finalizer, pg_cron job, and deletion RPCs successfully, then proved the role, table, RPC, extension, and cron schema had zero residue. The request boundary checks a password-created auth session no older than five minutes and the S09 active device; server triggers and restrictive RLS fail closed while pending; cancellation refuses an expired deadline; finalization deletes the auth owner so every existing ON DELETE CASCADE owner record follows. The backup workflow uses native pg_dump, GPG AES-256, pg_restore parsing, a pinned upload action, ciphertext-only upload, and 30-day retention."

[characterization]
captured_behavior = "The qualified auth shell, rotation setup, workout runtime, logbook, history, blast/cruise, offline working copy, and active-device transfer remain. S10 adds an account-status gate, deletion/recovery controls, local purge, authoritative cloud lifecycle, and encrypted operational backup without changing any training rule."
proof = "Existing characterization definitions and goldens remain byte-identical to main, and foundation-shell-v2 reproduced its exact golden locally. The rollback-only S10 production-schema compile supplies additive lifecycle proof without changing the established driver."

[separation_of_concerns]
before = "S09 qualified authentication recovery, cloud persistence, temporary offline use, and one active editing device, but it had no owner deletion lifecycle or operational backup."
after = "auth-actions owns the reauthentication/status/cancel client boundary; App owns the fail-closed recovery-only route; HomeScreen owns explicit owner confirmation; offline-sync owns device purge; the migration alone owns deadlines, data guards, and final deletion; the workflow and runbook own backup operations."

[architecture]
dependency_direction = "App reads deletion state through auth-actions before it mounts FoundationHome. HomeScreen calls one request action; the action reauthenticates, passes the existing durable device ID to the RPC, purges local state, and asks Supabase Auth for global sign-out. All client trust terminates at security-definer RPCs; those RPCs read auth.uid, JWT session ID, auth.sessions, and the private active-device row. The cron finalizer is private and not executable by browser roles. The independent backup job receives its database URL and passphrase only from Actions secrets and uploads only ciphertext."
