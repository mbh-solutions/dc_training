[responsibility_boundary]
path = "src/offline-sync.ts"
owns = "Account-keyed durable working state, durable browser device identity, ordered operation records, device-aware replay and registration, and cloud refresh."
does_not_own = "Authentication, PWA shell caching, database authority, simultaneous merge policy, lost-device recovery, or Supportability Gate behavior."

[incremental_refactor]
target = "Add only S09 one-active-editing-device enforcement and connected transfer to the qualified S08 app."
completed_step = "Extended the existing offline transport and hook, added one read-only/transfer panel, and added one forward migration wrapping the established dispatcher with atomic server authority. No package, training-rule, merge-policy, lost-data recovery, or Supportability Gate change."

[review_handoff]
summary = "Review device-ID durability and volatile-fallback queue preservation, connected-start checking, transfer queue drain, focus/foreground re-verification, owner advisory locking, rollout-session claim and upgrade, wrapper-before-dispatch rejection, and revocation of legacy write bypasses."
remaining_risks = [
    "A prior device that stays offline can still edit its local S08 working copy until connectivity returns; cloud rejects those stale writes and the UI then marks it read-only.",
    "Never-synced changes on another or lost device remain intentionally unrecoverable; the transfer UI states this explicitly.",
    "If both local storage and cookies reject the device ID, the mounted session can view data but transfer fails without deleting its unsynced queue.",
]

[human_review]
naming = "READ ONLY DEVICE, CHECKING EDIT ACCESS, and TRANSFER EDIT ACCESS state authority directly; the warning says the prior device becomes read-only and only cloud-synced data restores."
cohesion = "Presentation, authority scheduling, durable local state, transport, and authoritative database enforcement remain separate."
intended_behavior = "One signed-in device edits while secondary devices restore/view; connected transfer reverses authority without split writes."
reviewability = "Five narrow client edits, one forward migration, immutable existing characterization evidence, and one rollback-only S09 cloud poison implement S09; no package or new test was added."

