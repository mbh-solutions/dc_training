schema_version = "1.0"

[behavior]
intended_behavior = "One disposable component constant proves that the fixed hosted TypeScript quality profile executes and covers changed governed code."
proof = "One direct Node test imports and asserts the constant; one characterization scenario captures the same stable value; the S09 required Gate binds fixed commands and coverage to the exact PR head."

[characterization]
captured_behavior = "The disposable component exports only the stable S09 quality canary value."
proof = ".supportability-characterization.json maps the exact source path to a deterministic driver and golden; tests/s09-gate7-canary.test.mjs directly executes the changed module."

[separation_of_concerns]
before = "No disposable frontend quality-profile target existed."
after = "One single-purpose component module owns the temporary runtime canary value."
boundaries = [
  { path = "src/components/s09-gate7-canary.ts", kind = "module", symbol = "src/components/s09-gate7-canary.ts", before = "No disposable S09 frontend canary existed.", after = "The module owns one covered runtime constant." },
]

[architecture]
dependency_direction = "The direct test depends on the leaf canary module; the canary has no product dependency."
reviewed_paths = [
  ".supportability-characterization.json",
  ".supportability-review.toml",
  "src/components/s09-gate7-canary.ts",
  "tests/s09-gate7-canary.test.mjs",
  "tests/characterization/s09-gate7-canary.characterization.mjs",
  "tests/characterization/s09-gate7-canary.golden.json",
]

[responsibility_boundary]
path = "src/components/s09-gate7-canary.ts"
owns = "The disposable runtime value used to prove exact hosted TypeScript quality coverage."
does_not_own = "Product behavior, Gate implementation, dependencies, thresholds, exclusions, waivers, or permanent component architecture."

[incremental_refactor]
target = "Qualify Gate 7 on one protected frontend positive canary."
completed_step = "Add one covered runtime constant with one direct test and one deterministic characterization scenario."

[review_handoff]
summary = "Review the disposable S09 component and its direct evidence: one runtime constant is executed by one direct test and characterized by one stable scenario; no dependency, threshold, exclusion, waiver, high-risk behavior, or permanent architecture changes. Owner issue mbh-solutions/supportability-gate#152 narrowly requires Focuses 1-8 for this temporary qualification PR; AGENTS.md and production policy remain unchanged for S11 alignment."
remaining_risks = [
  "This temporary protected-base canary proves hosted Gate 7 mechanics only and is removed after its normal merge evidence is captured.",
  "The production repository review contract remains three focuses until the separately authorized S11 consumer transaction.",
]

[human_review]
naming = "s09-gate7-canary identifies the exact slice and temporary qualification purpose."
cohesion = "The new module owns one constant; its test and characterization own direct proof."
intended_behavior = "The fixed hosted TypeScript profile executes successfully and records coverage for the changed source."
reviewability = "The production diff is one exported constant with one direct assertion."

[[module_boundaries]]
path = "src/components/s09-gate7-canary.ts"
owner_path = "src/components/s09-gate7-canary.ts"
basis = "responsibility"
justification = "The disposable module owns one S09 Gate 7 canary value."
