schema_version = "1.0"

[behavior]
intended_behavior = "Exactly one durable browser device ID per owner account holds edit authority. A connected device stays fail-closed while authority is verified; offline startup alone may use cached authority. A second signed-in device restores cloud-synced data read-only. Connected transfer drains an active device queue before moving authority; after an explicit cloud-only warning, a read-only device with a durable identity discards its now-unauthorized stale queue and refreshes before transfer. If both durable browser stores reject identity persistence, transfer fails with the unsynced queue preserved."
proof = "The immutable offline-sync-v1 and foundation-shell-v2 scenarios reproduce their qualified S08 behavior at exact head. Production lint and build passed once. Rollback-only live-schema proof applied the candidate migration, proved active, secondary, transfer, repeated-transfer, stale-rejection, rollout-session claim/rejection/upgrade, and privilege-removal behavior, then returned zero residue. The server boundary serializes register, transfer, and replay on the same per-owner advisory transaction lock, stores one primary-keyed authority row per owner, rejects any replay whose authority differs, lets an already-open S08 client drain only while its server-derived auth session is bound to that row, preserves that binding when the same session registers its durable S09 device ID first, rotates both bindings on transfer, removes authenticated direct writes on every owner-mutable training table, and revokes every bypass-capable legacy mutation RPC."

[characterization]
captured_behavior = "The qualified auth shell, rotation setup, workout runtime, logbook, history, blast/cruise, and S08 offline working copy remain. S09 adds authority verification before hydration or replay, a fail-closed mutation seam, and an explicit connected transfer without changing exercise or training rules."
proof = "Existing characterization definitions and goldens remain byte-identical to main, and exact-head CI reproduces every golden. The rollback-only S09 cloud poison supplies additive device-authority proof without changing the established drivers."

[separation_of_concerns]
before = "S08 had one durable offline mutation seam but no device identity or active-editor authority; every signed-in device could call it."
after = "offline-sync owns the durable browser device ID with local-storage and cookie persistence plus device-aware transport; use-offline-sync owns fail-closed online authority verification, cached temporary-offline access, foreground checks, and transfer sequencing; HomeScreen owns read-only status and owner warning; the new migration alone owns durable authority, serialization, and cloud rejection before established offline dispatch."

[architecture]
dependency_direction = "FoundationHome composes use-offline-sync; feature hooks still submit only typed local operations; offline-sync registers one durable device ID and includes it on the current cloud mutation boundary; both rollout and current wrappers lock the owner, check the same private authority row, then delegate to the unchanged private S08 dispatcher. The rollout wrapper derives its bound auth-session ID from the signed JWT, register does not disclose another device ID, and transfer rotates both bindings server-side, so UI state cannot grant cloud authority without matching a private binding."
reviewed_paths = [
    "src/App.tsx",
