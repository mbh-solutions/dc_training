schema_version = "1.0"

[behavior]
intended_behavior = "Disposable type-only modules expose a static frontend dependency graph for protected Gate 3 qualification without adding runtime product behavior."
proof = "Both source modules export interfaces only, every cross-module edge uses import type, one direct test proves both modules have zero runtime exports, no product module imports either canary, and this pull request must remain unmerged."

[characterization]
captured_behavior = "The disposable type-only graph has no runtime behavior on either the valid H1 head or the poisoned H2 head."
proof = "The new s05-dependency-canary regression scenario covers both source paths and emits the same type_only_graph_has_no_runtime_behavior golden result on repeated base and head captures."

[separation_of_concerns]
before = "No disposable application/domain graph existed for frontend Gate 3 qualification."
after = "One application module owns the use-case type and one domain module owns the domain type used by the protected never-merge canary."
boundaries = [
  { path = "src/application/s05-canary.ts", kind = "module", symbol = "src/application/s05-canary.ts", before = "No disposable application boundary existed.", after = "This module owns only the disposable application-facing type." },
  { path = "src/domain/s05-canary.ts", kind = "module", symbol = "src/domain/s05-canary.ts", before = "No disposable domain boundary existed.", after = "This module owns only the disposable domain type." },
]

[architecture]
dependency_direction = "H1 contains one permitted application-to-domain type-only edge. H2 changes only the domain module to add the reverse domain-to-application type-only edge; Gate 3 must then report two cycle locations, one inversion, and one forbidden domain dependency."
reviewed_paths = [
  ".supportability-characterization.json",
  ".supportability-review.toml",
  "src/application/s05-canary.ts",
  "src/domain/s05-canary.ts",
  "tests/s05-dependency-canary.test.mjs",
  "tests/characterization/s05-dependency-canary.characterization.mjs",
  "tests/characterization/s05-dependency-canary.golden.json",
]

[responsibility_boundary]
path = "src/domain/s05-canary.ts"
owns = "The disposable domain type and, on H2 only, the deliberately forbidden reverse type-only edge used to prove Gate 3 isolation."
does_not_own = "Product behavior, target execution, Gate implementation, thresholds, exclusions, waivers, or permanent application architecture."

[incremental_refactor]
target = "Qualify static TypeScript dependency-direction enforcement on one protected never-merge frontend canary."
completed_step = "H1 adds the valid graph and exact evidence; H2 changes only the domain module to add the reverse poisoned edge."

[review_handoff]
summary = "Review only the disposable two-module type graph and its evidence: H1 is valid, H2 deliberately blocks Gate 3 only, Gate 3 uses static evidence while one direct quality test imports only the type-only canary modules, and no product behavior, dependency, threshold, exclusion, waiver, or permanent architecture changes."
remaining_risks = [
  "This artificial graph proves Gate 3 mechanics only; it is not product functionality.",
  "H2 is deliberately invalid and must remain unmerged; all disposable refs and temporary protection must be removed after evidence capture.",
]

[human_review]
naming = "s05-canary identifies the exact slice and disposable qualification purpose."
cohesion = "Each module owns one canary type; the characterization and review files own only proof metadata."
intended_behavior = "H1 passes all lanes; H2 adds one reverse type-only edge and blocks Gate 3 while Gate 4 remains green."
reviewability = "The production diff is two tiny interface-only modules; one direct test proves zero runtime exports; H2 changes only the five-line domain module."

[[module_boundaries]]
path = "src/application/s05-canary.ts"
owner_path = "src/application/s05-canary.ts"
basis = "responsibility"
justification = "The module owns one disposable application-facing canary type."

[[module_boundaries]]
path = "src/domain/s05-canary.ts"
owner_path = "src/domain/s05-canary.ts"
basis = "domain"
justification = "The module owns one disposable domain canary type."
