schema_version = "1.0"

[behavior]
intended_behavior = "Every extreme-stretch card shows one complete illustration without duplicated interface controls or clipped anatomy."
proof = "The seven-step A/B workout traversal confirms every stretch maps to an illustration-only asset; mobile browser captures inspect all seven rendered cards."

[characterization]
captured_behavior = "Stretch order, completion, skip, information copy, and workout advancement remain unchanged."
proof = "The existing A1 workout end-to-end suite traverses all seven stretches, validates their exact copy and asset mapping, and remains the bounded regression check for this increment."

[separation_of_concerns]
before = "Chest and triceps reused full-screen design mockups as runtime media, forcing one brittle crop rule to remove unrelated phone and dialog chrome."
after = "All seven runtime stretch entries use illustration-only assets and one shared contain renderer; dialog copy and controls remain React-owned."

[architecture]
dependency_direction = "WorkoutTracer owns stretch presentation and references static approved illustrations through Vite's existing asset URL pattern."
reviewed_paths = [
    "src/WorkoutTracer.tsx",
    "tests/a1-assignment.e2e.mjs",
    "docs/design/chest-stretch-illustration-approved.png",
    "docs/design/triceps-stretch-illustration-approved.png",
]

[responsibility_boundary]
path = "src/WorkoutTracer.tsx"
owns = "Stretch names, illustration selection, information controls, instruction dialogs, and complete or skip actions."
does_not_own = "Workout ordering, persistence, authentication, or illustration generation."

[incremental_refactor]
target = "Remove runtime dependence on full-screen mockups and the crop hack without changing stretch behavior."
completed_step = "Add the two missing illustration-only assets, route chest and triceps to them, and delete the special reference-image branch."

[review_handoff]
summary = "Review the two asset replacements and removal of the reference crop. Confirm all seven cards use the same contain path and both generated illustrations retain the approved exercise positions."
remaining_risks = [
    "Future illustration assets still need a visual mobile check because DOM-only tests cannot judge raster composition.",
]

[human_review]
naming = "The existing owner-approved stretch names and instruction copy are unchanged."
cohesion = "One stretch data table selects media; one shared card renderer displays it; the information dialog remains separate."
intended_behavior = "Chest shows one loaded-fly illustration and triceps shows the full seated overhead illustration; shoulders, biceps, back, hamstrings, and quadriceps remain fully visible."
reviewability = "The code diff removes one conditional branch and one CSS override; only two asset expectations change."

[[module_boundaries]]
path = "src/WorkoutTracer.tsx"
owner_path = "src/WorkoutTracer.tsx"
basis = "responsibility"
justification = "Owns the complete stretch-card presentation and its static media mapping."

[[module_boundaries]]
path = "tests/a1-assignment.e2e.mjs"
owner_path = "tests/a1-assignment.e2e.mjs"
basis = "verification"
justification = "Exercises the existing A/B stretch flow and verifies exact runtime media selection and copy."
