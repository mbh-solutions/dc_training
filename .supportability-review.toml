schema_version = "1.0"

[behavior]
intended_behavior = "Adopt repository enforcement without changing the deployed DC Training application behavior."
proof = "The foundation characterization captures owner sign-in, recovery, cloud-record access, offline status, React mounting, and browser-safe Supabase construction before and after this onboarding repair."

[characterization]
captured_behavior = "The current foundation provides owner authentication, a protected owner record, the approved Home shell, installable PWA behavior, temporary offline launch, and reconnection."
proof = "tests/characterization/foundation-shell.characterization.mjs mounts the real app, restores a session through retained hook state, drives offline and PASSWORD_RECOVERY callbacks, submits the real sign-in and recovery forms, and records the resulting Supabase calls on both exact base and head revisions."

[separation_of_concerns]
before = "The React foundation had explicit UI and Supabase client boundaries but no repository-level Supportability Gate contract."
after = "The application boundaries remain unchanged while fixed TypeScript complexity, import-boundary, coverage, and semantic-review evidence become repository policy."

[architecture]
dependency_direction = "src/main.tsx composes src/App.tsx; src/App.tsx depends on src/lib/supabase.ts; the Supabase client boundary does not import UI composition."
reviewed_paths = [
    "src/App.tsx",
    "src/index.css",
    "src/lib/supabase.ts",
    "src/main.tsx",
    "src/vite-env.d.ts",
]

[responsibility_boundary]
path = "src/App.tsx"
owns = "Owner authentication state, the foundation profile read, and approved Home-shell presentation."
does_not_own = "Supabase client construction, database policy, build configuration, service-worker generation, or future workout-domain behavior."

[incremental_refactor]
target = "Complete the smallest evidence packet required by the active repository gate."
completed_step = "Added one deterministic foundation characterization and one source-loading coverage test; formatted existing source and made NodeNext imports explicit."

[review_handoff]
summary = "Review exact foundation characterization, high-risk auth/UI coverage, explicit dependency direction, maximum complexity 10, and unchanged owner-visible behavior."
remaining_risks = [
    "Browser interaction remains proven by the completed live foundation checks; the automated onboarding test covers module loading and safe unconfigured startup.",
]

[human_review]
naming = "App and Supabase boundaries use direct product and platform names."
cohesion = "Characterization owns behavior capture; the focused module test owns executable source coverage."
intended_behavior = "Owner authentication, recovery, protected cloud status, offline status, and Home-shell presentation remain unchanged."
reviewability = "The repair is limited to gate-required evidence plus mechanical formatting, explicit NodeNext imports, and a safe missing-root guard."

[[module_boundaries]]
path = "src/App.tsx"
owner_path = "src/App.tsx"
basis = "responsibility"
justification = "Owns foundation authentication flow and approved Home-shell presentation."

[[module_boundaries]]
path = "src/lib/supabase.ts"
owner_path = "src/lib/supabase.ts"
basis = "responsibility"
justification = "Owns browser-safe Supabase client construction and environment validation."

[[module_boundaries]]
path = "src/main.tsx"
owner_path = "src/main.tsx"
basis = "responsibility"
justification = "Owns React root creation and top-level application mounting."
