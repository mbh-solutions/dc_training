schema_version = "1.0"

[behavior]
intended_behavior = "A protected never-merge canary represents root tsconfig.json as a Git symlink so architecture artifact identity validation fails closed."
proof = "The exact head tree records tsconfig.json as mode 120000 with target bytes tsconfig.app.json; no production source, dependency, threshold, exclusion, waiver, or product behavior changes."

[characterization]
captured_behavior = "Product runtime behavior is unchanged because the deliberately invalid configuration identity is rejected before target configuration is read or followed."
proof = "Existing characterization definitions and product source are byte-identical to the protected base; only review evidence and the root tsconfig.json tree identity change."

[separation_of_concerns]
before = "The protected base stores tsconfig.json as a regular configuration blob."
after = "The never-merge head stores tsconfig.json as a symlink solely to exercise shared architecture identity failure."
boundaries = []

[architecture]
dependency_direction = "No dependency graph change is authorized; the canary must fail closed before graph construction with ARCHITECTURE_SYMLINK_OR_NONFILE."
reviewed_paths = [
  ".supportability-review.toml",
  "tsconfig.json",
]

[responsibility_boundary]
path = "tsconfig.json"
owns = "The disposable shared architecture configuration-identity poison only."
does_not_own = "Product behavior, dependency direction, target execution, Gate implementation, thresholds, exclusions, waivers, or permanent configuration."

[incremental_refactor]
target = "Prove shared fail-closed handling for a non-regular architecture configuration artifact."
completed_step = "Represent only root tsconfig.json as an exact Git symlink and bind truthful no-production-boundary review evidence."

[review_handoff]
summary = "This protected never-merge canary must produce ARCHITECTURE_SYMLINK_OR_NONFILE as a shared technical failure for Gates 3 and 4 only; all other lanes must pass and no Codex review is requested."
remaining_risks = [
  "This deliberately invalid head must remain unmerged.",
  "All disposable refs and temporary protection must be removed after evidence capture.",
]

[human_review]
naming = "The canary title and paths identify the S05 shared architecture identity proof."
cohesion = "tsconfig.json carries the poison; the review file carries only exact evidence required by unaffected lanes."
intended_behavior = "Gates 3 and 4 fail technically; Gates 1 and 2 plus Gates 5 through 8 pass."
reviewability = "The complete diff is one Git mode/target change plus one evidence file; no production source boundary changes."
