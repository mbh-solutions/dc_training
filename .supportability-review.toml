schema_version = "1.0"

[behavior]
intended_behavior = "Let the authenticated owner start or resume the automatically selected A1 workout, durably log or skip every configured exercise and required stretch, undo the latest save, complete once, and return Home with B1 next."
proof = "tests/a1-assignment.e2e.mjs mounts src/main.tsx with real React, drives Home through A1 completion, leaves/resumes, undoes/re-saves, checks exact stretch copy, retries the final operation, and returns to Home with B1. tests/workout-domain.test.mjs proves exact canonical conversion."

[characterization]
captured_behavior = "The qualified auth/offline shell and full rotation setup remain, while a1-workout-v1 fail-closed checks the A1 surface declarations, RPC calls, conversion constants, and Home selectors without executing target-controlled code."
proof = "The existing foundation-shell-v2 and rotation-setup-v1 scenarios remain registered; the staged a1-workout-v1 static contract covers the new production paths, while tests/a1-assignment.e2e.mjs separately mounts the real React application and proves the complete workout path."

[separation_of_concerns]
before = "FoundationHome selected Home or Rotation Setup; no workout state, persistence, or execution UI existed."
after = "FoundationHome selects Home, Rotation Setup, active workout, or completion; useWorkout owns validated Supabase calls; workout-domain owns exact conversion and data guards; WorkoutTracer owns controlled presentation."

[architecture]
dependency_direction = "App composes FoundationHome; FoundationHome composes HomeScreen, RotationSetup, WorkoutTracer, and useWorkout; useWorkout alone reaches the Supabase client; WorkoutTracer and the hook depend on workout-domain."
reviewed_paths = [
    "src/FoundationHome.tsx",
    "src/HomeScreen.tsx",
    "src/WorkoutTracer.tsx",
    "src/hooks/use-workout.ts",
    "src/workout-domain.ts",
]

[responsibility_boundary]
path = "src/hooks/use-workout.ts"
owns = "Loading owner workout state and invoking start, durable step-save, undo, and completion-return RPC contracts."
does_not_own = "Workout visuals, assignment configuration, authentication, SQL invariants, or future B-workout execution."

[incremental_refactor]
target = "Add only the S03 A1 tracer to the qualified S02 application."
completed_step = "Reused fixed assignment contracts and added one A1-only state boundary, one presentation module, one domain module, and one additive migration."

[review_handoff]
summary = "Review A1-only client orchestration, exact weight conversion, approved stretch presentation, additive RLS schema, and atomic idempotent final-step transition."
remaining_risks = [
    "The owner must finish the remaining A1 assignments before Start is enabled by the database contract.",
    "B1 is displayed after completion but intentionally cannot start until a later slice.",
]

[human_review]
naming = "WorkoutTracer, useWorkout, and workout-domain name their presentation, cloud-orchestration, and pure-domain responsibilities directly."
cohesion = "One hook owns remote state, one domain file owns shared validation/conversion, and one view file owns the bounded A1 screens."
intended_behavior = "The owner gains one durable A1 completion path with no B-day, history, logbook-failure, cruise, or offline-queue expansion."
reviewability = "The diff adds three focused source modules, one migration, one targeted unit check, and one real-React behavior extension."

[[module_boundaries]]
path = "src/WorkoutTracer.tsx"
owner_path = "src/WorkoutTracer.tsx"
basis = "responsibility"
justification = "Owns A1 exercise, stretch, and completion presentation only."

[[module_boundaries]]
path = "src/hooks/use-workout.ts"
owner_path = "src/hooks/use-workout.ts"
basis = "responsibility"
justification = "Owns validated owner workout loading and Supabase RPC orchestration only."

[[module_boundaries]]
path = "src/workout-domain.ts"
owner_path = "src/workout-domain.ts"
basis = "responsibility"
justification = "Owns workout row guards, set counts, labels, and exact unit conversion only."
