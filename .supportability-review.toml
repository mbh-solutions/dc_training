[responsibility_boundary]
path = "supabase/migrations/20260811054903_account_deletion_lifecycle.sql"
owns = "Authoritative request time, 30-day deadline, pending-account data denial, cancellation, scheduled auth-owner deletion, and browser-role privilege boundaries."
does_not_own = "Password UI, local browser storage, GitHub artifact encryption, authentication email delivery, or Supportability Gate behavior."

[incremental_refactor]
target = "Replace consumer-visible edit-access transfer with safe multi-device editing without allowing partial replay or silent conflict loss."
completed_step = "Add atomic revision-mode activation, whole-queue CAS and receipts, stable cloud snapshots, explicit conflict recovery, cached-client write fencing, and a one-time confirmed lost-device upgrade path. Production owner-device qualification remains required before claiming rollout complete."

[review_handoff]
summary = "Review the multi-device cutover: current clients never call transfer; legacy clients become non-writable after activation; activation/takeover is one owner-locked RPC; one sealed queue maps to one idempotent batch receipt; only applied batches delete local operations; conflicts freeze editing and remain reviewable."
remaining_risks = [
    "A device that remains permanently offline cannot receive a remote deletion signal; the requesting active device is purged immediately, and cloud data is unavailable to every device while pending.",
    "The built-in authentication email path remains acceptable only if the pre-authorized owner proves delivery during final production qualification.",
    "Backup and restore production evidence requires the protected Actions database URL, retained encryption passphrase, and an isolated owner-approved restore target; none may be browser exposed.",
]

[human_review]
naming = "SYNC UPDATE NEEDED, CONTINUE ON THIS DEVICE, CHANGES FROM ANOTHER DEVICE, CHANGES NEED REVIEW, USE CLOUD DATA, REVIEW DEVICE COPY, and NOT NOW state the owner decision without exposing edit-authority jargon."
cohesion = "Presentation, auth orchestration, local erasure, authoritative database lifecycle, encrypted backup, and operator documentation remain separate."
intended_behavior = "Normal sign-in permits editing on every current device. Revision mismatch applies zero local operations, preserves the full device queue, and requires an explicit owner recovery choice."
reviewability = "The client state machine is localized to offline-sync and use-offline-sync; presentation is localized to FoundationHome and HomeScreen; the forward migration contains the complete server cutover and compatibility contract. Packages and training rules are unchanged."

