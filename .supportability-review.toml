schema_version = "1.0"

[behavior]
intended_behavior = "A new account with valid A1 assignments can start its first A1 workout once. Online Start waits for the authoritative sync result, and a rejected Start without workout entries returns to Home with a retry message instead of a full-screen data-loss warning."
proof = "Production captured two rejected first-A1 batches with base revision 5 and exact active assignment IDs. A rollback-only production transaction installed the candidate function, replayed the same context, returned applied revision 6, created one in-progress A1 workout, and initialized rotation to A1. Rollback residue checks returned revision 5, zero workouts, zero rotation rows, and zero test receipts."

[characterization]
captured_behavior = "Rotation setup stays expanded after an exercise save. Existing rotation, workout, offline, and conflict behavior remains unchanged outside the missing first-rotation state and sole rejected-Start recovery paths."
proof = "The directly relevant A1 assignment/workout suite and production build are the bounded regression evidence for this increment."

[separation_of_concerns]
before = "The offline start validator rejected a missing rotation row before the authoritative start function could initialize a new account to A1; online Start also navigated from optimistic local state before server confirmation."
after = "The migration owns the guarded initial-A1 rule. use-offline-sync waits for authoritative online Start confirmation and clears only a sole rejected Start with no workout entries. RotationSetup owns the expanded workout selection across its editor flow."

[architecture]
dependency_direction = "RotationSetup passes expansion state into its view. use-workout delegates Start to use-offline-sync. The hook delegates persistence and conflict resolution to offline-sync. The private database validator remains the authoritative rotation guard."
reviewed_paths = [
    "src/RotationSetup.tsx",
    "src/RotationSetupView.tsx",
    "src/hooks/use-offline-sync.ts",
    "supabase/migrations/20260812025545_allow_initial_a1_offline_start.sql",
    "tests/a1-assignment.e2e.mjs",
    ".supportability-characterization.json",
]

[responsibility_boundary]
path = "supabase/migrations/20260812025545_allow_initial_a1_offline_start.sql"
owns = "Authoritative acceptance of a missing rotation row only for A1 when the owner has no workout history, while retaining blast, active-workout, assignment, and existing-rotation checks."
does_not_own = "Workout presentation, local queue storage, account authentication, or later rotation advancement."

[incremental_refactor]
target = "Remove the false first-workout conflict without weakening real offline conflict protection."
completed_step = "Guard the legitimate missing-row A1 case, wait for online Start sync, and recover only a sole rejected Start that cannot contain workout performance."

[review_handoff]
summary = "Review the missing-row guard and online Start outcome. A missing row is accepted only for A1 with zero historical workouts; any existing row mismatch or missing row with history still rejects. Mixed queues and any queue containing workout steps still require manual review."
remaining_risks = [
    "A device that is genuinely offline continues from optimistic local state by design and syncs later.",
]

[human_review]
naming = "WORKOUT COULD NOT START · TRY AGAIN is a basic-user recovery message; database error text remains internal."
cohesion = "Rotation expansion, React sync scheduling, local persistence, and authoritative database validation remain separate."
intended_behavior = "The first valid A1 Start opens normally after cloud confirmation; a server-rejected empty Start stays on Home without presenting a misleading data-loss decision."
reviewability = "The server change is isolated to one existing validator, and the client exception is restricted to exactly one rejected start_workout operation."

[[module_boundaries]]
path = "src/RotationSetup.tsx"
owner_path = "src/RotationSetup.tsx"
basis = "responsibility"
justification = "Owns setup-flow UI state that must survive exercise editor navigation."

[[module_boundaries]]
path = "src/RotationSetupView.tsx"
owner_path = "src/RotationSetupView.tsx"
basis = "responsibility"
justification = "Renders the controlled expandable workout sections without owning their navigation lifetime."

[[module_boundaries]]
path = "src/hooks/use-offline-sync.ts"
owner_path = "src/hooks/use-offline-sync.ts"
basis = "responsibility"
justification = "Owns online synchronization scheduling and the safe distinction between an empty rejected Start and saved workout data."

[[module_boundaries]]
path = "supabase/migrations/20260812025545_allow_initial_a1_offline_start.sql"
owner_path = "supabase/migrations/20260812025545_allow_initial_a1_offline_start.sql"
basis = "responsibility"
justification = "Owns the forward-only authoritative repair for first-A1 rotation initialization."
