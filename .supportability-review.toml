schema_version = "1.0"

[behavior]
intended_behavior = "Preserve the qualified owner foundation and add one authenticated A1 chest assignment path with explicit exercise, protocol, and range selection, one cloud save, and restored state."
proof = "The characterization mounts the real React application, exercises owner authorization, drives select-review-back-save-remount through the A1 UI, records one Supabase upsert keyed by owner and A1, and verifies restored state."

[characterization]
captured_behavior = "The foundation behaviors remain and the owner can configure and restore one A1 chest assignment without preselected choices."
proof = "tests/characterization/foundation-shell.characterization.mjs mounts src/main.tsx through React createRoot, drives the existing foundation flows plus the full A1 assignment UI, verifies all nine approved chest exercises, preserves review-back state, records exactly one owner-keyed upsert, and remounts the assignment from cloud data."

[separation_of_concerns]
before = "App owned session lifecycle, network listeners, profile authorization, route selection, and Home presentation; the Supabase module also parsed callback URLs."
after = "App selects authenticated screens; RotationSetup owns the one A1 assignment flow and Supabase boundary; focused foundation modules retain their existing responsibilities."

[architecture]
dependency_direction = "src/main.tsx mounts App; App composes authentication, FoundationHome, and RotationSetup; RotationSetup imports only the Supabase client and A1 assignment constants; foundation hooks retain their existing leaf dependencies."
reviewed_paths = [
    "src/App.tsx",
    "src/AuthScreens.tsx",
    "src/FoundationHome.tsx",
    "src/RotationSetup.tsx",
    "src/hooks/use-auth-session.ts",
    "src/hooks/use-foundation-profile.ts",
    "src/hooks/use-online.ts",
    "src/hooks/use-owner-access.ts",
    "src/index.css",
    "src/lib/auth-actions.ts",
    "src/lib/auth-callback.ts",
    "src/lib/offline-owner-session.ts",
    "src/lib/supabase.ts",
    "src/main.tsx",
    "src/rotation-assignment.ts",
]

[responsibility_boundary]
path = "src/App.tsx"
owns = "Top-level authenticated screen selection and composition."
does_not_own = "Assignment form state or persistence, auth forms or lifecycle, profile queries, Home presentation, Supabase construction, database policy, or future workout behavior."

[incremental_refactor]
target = "Correct the exact semantic findings without expanding the product scope."
completed_step = "Added only the A1 chest assignment tracer, reusing the existing shell, React state, CSS, Supabase client, and owner authorization boundary."

[review_handoff]
summary = "Review the unchanged owner-access boundary plus the isolated A1 selection, protocol, range, review, one-upsert, and cloud-restore flow with real React characterization."
remaining_risks = [
    "Live Supabase RLS and deployed runtime evidence remain external to deterministic source characterization.",
]

[human_review]
naming = "Each hook and auth action names one concrete responsibility; AuthScreens, FoundationHome, and auth-callback name their direct boundaries."
cohesion = "App composes; RotationSetup owns the bounded A1 workflow; rotation-assignment owns its fixed pool and display formatting; existing foundation modules remain focused."
intended_behavior = "Qualified owner foundation remains; authenticated owner gains exactly one A1 chest assignment path with explicit choices and durable restoration."
reviewability = "The change is limited to one feature component, one constant module, existing shell/CSS entry points, one migration, and focused characterization; no dependency or generalized workout model was added."

[[module_boundaries]]
path = "src/App.tsx"
owner_path = "src/App.tsx"
basis = "responsibility"
justification = "Owns top-level screen selection and composition only."

[[module_boundaries]]
path = "src/AuthScreens.tsx"
owner_path = "src/AuthScreens.tsx"
basis = "responsibility"
justification = "Owns authentication and recovery form presentation, local form state, and input validation while delegating client workflows."

[[module_boundaries]]
path = "src/FoundationHome.tsx"
owner_path = "src/FoundationHome.tsx"
basis = "responsibility"
justification = "Owns approved Home-shell and network-status presentation only."

[[module_boundaries]]
path = "src/RotationSetup.tsx"
owner_path = "src/RotationSetup.tsx"
basis = "responsibility"
justification = "Owns the complete and intentionally bounded A1 chest assignment UI state, load, and single-save boundary."

[[module_boundaries]]
path = "src/rotation-assignment.ts"
owner_path = "src/rotation-assignment.ts"
basis = "responsibility"
justification = "Owns the approved chest exercise pool and target-range display formatting shared by UI and targeted proof."

[[module_boundaries]]
path = "src/hooks/use-auth-session.ts"
owner_path = "src/hooks/use-auth-session.ts"
basis = "responsibility"
justification = "Owns Supabase session lifecycle and recovery state."

[[module_boundaries]]
path = "src/hooks/use-foundation-profile.ts"
owner_path = "src/hooks/use-foundation-profile.ts"
basis = "responsibility"
justification = "Owns the current-user foundation-profile query and its cloud and synchronization presentation state."

[[module_boundaries]]
path = "src/hooks/use-owner-access.ts"
owner_path = "src/hooks/use-owner-access.ts"
basis = "responsibility"
justification = "Owns online and offline owner-access state plus local sign-out enforcement while delegating profile loading and token verification."

[[module_boundaries]]
path = "src/hooks/use-online.ts"
owner_path = "src/hooks/use-online.ts"
basis = "responsibility"
justification = "Owns browser connectivity observation."

[[module_boundaries]]
path = "src/lib/auth-actions.ts"
owner_path = "src/lib/auth-actions.ts"
basis = "responsibility"
justification = "Owns focused Supabase owner-authentication client workflows without UI state or presentation."

[[module_boundaries]]
path = "src/lib/auth-callback.ts"
owner_path = "src/lib/auth-callback.ts"
basis = "responsibility"
justification = "Owns initial authentication callback parsing."

[[module_boundaries]]
path = "src/lib/offline-owner-session.ts"
owner_path = "src/lib/offline-owner-session.ts"
basis = "responsibility"
justification = "Owns fail-closed verification of a cached session against build-pinned Supabase signing keys, issuer, audience, expiry, role, anonymity, and owner subject."

[[module_boundaries]]
path = "src/lib/supabase.ts"
owner_path = "src/lib/supabase.ts"
basis = "responsibility"
justification = "Owns browser-safe Supabase client construction and public environment configuration, including the pinned JWKS and owner-subject digest."

[[module_boundaries]]
path = "src/main.tsx"
owner_path = "src/main.tsx"
basis = "responsibility"
justification = "Owns React root creation and top-level application mounting."
