[architecture]
dependency_direction = "React screens use an isolated draft hook and shared dialog; the offline reducer and database replay compatible exercise history; pure domain functions normalize names and validate integer bounds."
reviewed_paths = ["src/Dialog.tsx", "src/FoundationHome.tsx", "src/HistoryScreen.tsx", "src/HomeScreen.tsx", "src/RotationSetupView.tsx", "src/WorkoutTracer.tsx", "src/hooks/use-workout-draft.ts", "src/offline-sync.ts", "src/workout-domain.ts"]

[responsibility_boundary]
path = "src/hooks/use-workout-draft.ts"
owns = "Device-local pending workout inputs, validated restoration and cleanup after successful submission."
does_not_own = "Cloud synchronization, saved performance, authentication, comparison rules or workout progression."

[incremental_refactor]
target = "Remove audited workout friction while preserving existing saved data and training rules."
completed_step = "Reusable draft and dialog behavior, shared history identity, correction input controls and paired client/database enforcement."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "RP1/RP2/RP3 are owner-approved; shared failure tracking describes consecutive compatible appearances, not a lifetime or whole-blast allowance."
cohesion = "Draft storage and focus management are independent of workout business rules. Reducer and SQL replay the same exercise sequence."
intended_behavior = "A mulligan follows the exercise across slots; a later win clears it. Corrections and undo recalculate shared history."
reviewability = "Owner approved the interactive mockup and asked to resume implementation and delivery. Tests cover the reproduced defects without using real production workout data."
