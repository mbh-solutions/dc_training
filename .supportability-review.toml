schema_version = "1.0"

[behavior]
intended_behavior = "Preserve the owner workflows while making online foundation-profile authorization fail closed on missing data or query errors."
proof = "The foundation characterization mounts the real application and verifies both profile failure paths hide the protected shell and locally sign out."

[characterization]
captured_behavior = "The foundation provides owner authentication, protected profile authorization, the approved Home shell, temporary offline launch, reconnection, and password recovery."
proof = "tests/characterization/foundation-shell.characterization.mjs mounts src/main.tsx through React createRoot, drives real effects and form events, verifies profile absence and query errors fail closed, and records Supabase-boundary calls."

[separation_of_concerns]
before = "App owned session lifecycle, network listeners, profile authorization, route selection, and Home presentation; the Supabase module also parsed callback URLs."
after = "App only selects screens and composes focused auth, network, profile-authorization, callback-parsing, client-construction, and Home-presentation boundaries."

[architecture]
dependency_direction = "src/main.tsx mounts App; App composes focused hooks and FoundationHome; hooks depend on callback parsing or the Supabase client; neither library module imports UI."
reviewed_paths = [
    "src/App.tsx",
    "src/FoundationHome.tsx",
    "src/hooks/use-auth-session.ts",
    "src/hooks/use-foundation-profile.ts",
    "src/hooks/use-online.ts",
    "src/index.css",
    "src/lib/auth-callback.ts",
    "src/lib/supabase.ts",
    "src/main.tsx",
    "src/vite-env.d.ts",
]

[responsibility_boundary]
path = "src/App.tsx"
owns = "Top-level screen selection plus sign-in, recovery, loading, and setup screen presentation."
does_not_own = "Auth lifecycle, network listeners, profile queries, Home presentation, callback parsing, Supabase construction, database policy, or future workout behavior."

[incremental_refactor]
target = "Correct the three exact semantic findings without expanding the product scope."
completed_step = "Extracted focused lifecycle and presentation boundaries, separated callback parsing, and made profile query errors fail closed."

[review_handoff]
summary = "Review the thin App composition, fail-closed profile guard, focused dependency direction, and real React characterization."
remaining_risks = [
    "Live Supabase RLS, deployed PWA caching, and iPhone installation remain deployment evidence outside source characterization.",
]

[human_review]
naming = "Each hook names its one lifecycle; FoundationHome and auth-callback name their direct responsibilities."
cohesion = "App composes; hooks own stateful effects; FoundationHome presents; library modules parse callback input or construct the client."
intended_behavior = "Owner authentication, recovery, cloud status, offline shell, and Home presentation remain, while authorization errors now deny access."
reviewability = "The correction maps directly to the three semantic findings and adds no product feature or dependency."

[[module_boundaries]]
path = "src/App.tsx"
owner_path = "src/App.tsx"
basis = "responsibility"
justification = "Owns top-level screen selection and authentication-screen presentation only."

[[module_boundaries]]
path = "src/FoundationHome.tsx"
owner_path = "src/FoundationHome.tsx"
basis = "responsibility"
justification = "Owns approved Home-shell and network-status presentation only."

[[module_boundaries]]
path = "src/hooks/use-auth-session.ts"
owner_path = "src/hooks/use-auth-session.ts"
basis = "responsibility"
justification = "Owns Supabase session lifecycle and recovery state."

[[module_boundaries]]
path = "src/hooks/use-foundation-profile.ts"
owner_path = "src/hooks/use-foundation-profile.ts"
basis = "responsibility"
justification = "Owns fail-closed foundation-profile authorization and cloud status."

[[module_boundaries]]
path = "src/hooks/use-online.ts"
owner_path = "src/hooks/use-online.ts"
basis = "responsibility"
justification = "Owns browser connectivity observation."

[[module_boundaries]]
path = "src/lib/auth-callback.ts"
owner_path = "src/lib/auth-callback.ts"
basis = "responsibility"
justification = "Owns initial authentication callback parsing."

[[module_boundaries]]
path = "src/lib/supabase.ts"
owner_path = "src/lib/supabase.ts"
basis = "responsibility"
justification = "Owns browser-safe Supabase client construction and environment validation."

[[module_boundaries]]
path = "src/main.tsx"
owner_path = "src/main.tsx"
basis = "responsibility"
justification = "Owns React root creation and top-level application mounting."
