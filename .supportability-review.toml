schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Describe implemented DC Training behavior and operator procedures in the README and canonical wiki pages without changing the application."
proof = "Documentation is checked against source, tests and configuration; links and published rendering are verified before handoff."

[characterization]
captured_behavior = "Application source, dependencies and database migrations are unchanged."
proof = "The documentation describes the existing tested workflows; protected qualification binds this documentation change."

[separation_of_concerns]
before = "Product documentation has no complete owner and maintainer reading paths."
after = "The README directs readers to focused wiki pages; the backup runbook remains the home for detailed restore procedures. No production responsibilities change."
boundaries = []

[architecture]
dependency_direction = "Application imports and dependency declarations are unchanged; wiki pages link directly to the responsible source modules."
reviewed_paths = ["README.md", "docs/wiki", "docs/operations/ACCOUNT_LIFECYCLE_AND_BACKUPS.md"]

[responsibility_boundary]
path = "docs/wiki"
owns = "Canonical product guidance, user workflows and maintainer documentation."
does_not_own = "Workout behavior, saved data, authentication, database schema or user preferences."

[incremental_refactor]
target = "Publish concise, source-grounded README and GitHub Wiki documentation."
completed_step = "README entry point, focused wiki pages, navigation, diagrams and manual publication procedure."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "UI labels match the application, including RP1/RP2/RP3 and combined target ranges."
cohesion = "Each detailed subject has one primary home; the README and sidebar provide reading paths."
intended_behavior = "Document current behavior without release summaries or changing application behavior."
reviewability = "The owner requested a published README and GitHub Wiki following the supplied documentation guidelines, without revision language. Source files are reviewed before the wiki is published."
