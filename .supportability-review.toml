schema_version = "1.0"

[behavior]
intended_behavior = "Let the authenticated owner start or resume the automatically selected A1 workout, durably log every configured exercise and required stretch, undo the latest save, complete once, and return Home with B1 next."
proof = "tests/a1-assignment.e2e.mjs mounts src/main.tsx with real React, drives Home through A1 completion, leaves/resumes, preserves a step operation ID across a lost response, undoes/re-saves, checks exact stretch copy, retries the final operation, and returns to Home with B1. tests/workout-domain.test.mjs proves exact canonical conversion."

[characterization]
captured_behavior = "The qualified auth/offline shell and full rotation setup remain, while a1-workout-v1 fail-closed checks the A1 surface declarations, RPC calls, conversion constants, and Home selectors without executing target-controlled code."
proof = "The existing foundation-shell-v2 and rotation-setup-v1 scenarios remain registered; the staged a1-workout-v1 static contract covers the new production paths, while tests/a1-assignment.e2e.mjs separately mounts the real React application and proves the complete workout path."

[separation_of_concerns]
before = "FoundationHome selected Home or Rotation Setup; no workout state, persistence, or execution UI existed."
after = "FoundationHome selects Home, Rotation Setup, active workout, or completion; useWorkout owns React state transitions; workout-api owns validated Supabase calls; workout-domain owns row guards; weight-conversion owns exact conversion; WorkoutTracer owns controlled presentation."

[architecture]
dependency_direction = "App composes FoundationHome; FoundationHome composes HomeScreen, RotationSetup, WorkoutTracer, and useWorkout; useWorkout delegates cloud I/O to workout-api; workout-api alone reaches the Supabase client; row validation and weight conversion remain inward dependencies."
reviewed_paths = [
    "src/FoundationHome.tsx",
    "src/HomeScreen.tsx",
    "src/WorkoutTracer.tsx",
    "src/hooks/use-workout.ts",
    "src/weight-conversion.ts",
    "src/workout-api.ts",
    "src/workout-domain.ts",
]

[responsibility_boundary]
path = "src/hooks/use-workout.ts"
owns = "React state transitions for validated workout loads, saves, undo, and completion results."
does_not_own = "Workout visuals, Supabase calls, response validation, SQL invariants, or future B-workout execution."

[incremental_refactor]
target = "Add only the S03 A1 tracer to the qualified S02 application."
completed_step = "Reused fixed assignment contracts and added focused A1 presentation, state, API, row-validation, and weight-conversion boundaries plus one additive migration."

[review_handoff]
summary = "Review A1-only client orchestration, exact weight conversion, approved stretch presentation, additive RLS schema, and atomic idempotent final-step transition."
remaining_risks = [
    "The owner must finish the remaining A1 assignments before Start is enabled by the database contract.",
    "B1 is displayed after completion but intentionally cannot start until a later slice.",
]

[human_review]
naming = "WorkoutTracer, useWorkout, workout-api, workout-domain, and weight-conversion name their presentation, state, I/O, row-validation, and conversion responsibilities directly."
cohesion = "The hook owns React state, workout-api owns cloud I/O, workout-domain owns row guards, weight-conversion owns exact conversion, and WorkoutTracer owns A1 presentation."
intended_behavior = "The owner gains one durable A1 completion path with no B-day, history, logbook-failure, cruise, or offline-queue expansion."
reviewability = "The diff adds five focused source modules, one migration, one targeted unit check, and one real-React behavior extension."

[[module_boundaries]]
path = "src/WorkoutTracer.tsx"
owner_path = "src/WorkoutTracer.tsx"
basis = "responsibility"
justification = "Owns A1 exercise, stretch, and completion presentation only."

[[module_boundaries]]
path = "src/hooks/use-workout.ts"
owner_path = "src/hooks/use-workout.ts"
basis = "responsibility"
justification = "Owns React workout state transitions and retry-operation identity only."

[[module_boundaries]]
path = "src/workout-domain.ts"
owner_path = "src/workout-domain.ts"
basis = "responsibility"
justification = "Owns complete fail-closed guards for workout, rotation, and step rows only."

[[module_boundaries]]
path = "src/workout-api.ts"
owner_path = "src/workout-api.ts"
basis = "responsibility"
justification = "Owns owner-filtered Supabase workout I/O and validated API results only."

[[module_boundaries]]
path = "src/weight-conversion.ts"
owner_path = "src/weight-conversion.ts"
basis = "responsibility"
justification = "Owns exact weight parsing, integer-microgram conversion, and display conversion only."
