[responsibility_boundary]
path = "supabase/migrations/20260811054903_account_deletion_lifecycle.sql"
owns = "Authoritative request time, 30-day deadline, pending-account data denial, cancellation, scheduled auth-owner deletion, and browser-role privilege boundaries."
does_not_own = "Password UI, local browser storage, GitHub artifact encryption, authentication email delivery, or Supportability Gate behavior."

[incremental_refactor]
target = "Repair the repeatable two-confirm mobile edit-access transfer exposed during final owner-iPhone qualification."
completed_step = "Replaced the native confirmation with the same in-app warning, serialized transfer against any foreground synchronization already running, and removed the redundant pre-transfer sync. No database, package, training rule, or Supportability Gate change was made."

[review_handoff]
summary = "Review the mobile confirm/focus race: the warning is rendered in-app without foregrounding or unmounting the app, foreground synchronization is suppressed while transfer owns the boundary, any synchronization already started is awaited, stale local operations are discarded under the existing warning, and authority is transferred once."
remaining_risks = [
    "A device that remains permanently offline cannot receive a remote deletion signal; the requesting active device is purged immediately, and cloud data is unavailable to every device while pending.",
    "The built-in authentication email path remains acceptable only if the pre-authorized owner proves delivery during final production qualification.",
    "Backup and restore production evidence requires the protected Actions database URL, retained encryption passphrase, and an isolated owner-approved restore target; none may be browser exposed.",
]

[human_review]
naming = "DELETE ACCOUNT, BEGIN 30-DAY DELETION, ACCOUNT UNAVAILABLE, DELETION PENDING, and CANCEL DELETION state the lifecycle directly; the permanent warning names account, cloud history, and device data."
cohesion = "Presentation, auth orchestration, local erasure, authoritative database lifecycle, encrypted backup, and operator documentation remain separate."
intended_behavior = "The owner opens the transfer warning and confirms once on mobile; the same invocation completes the transfer without a native-dialog focus remount."
reviewability = "ReadOnlyDeviceStatus owns the in-app warning. The existing offline-sync hook owns foreground/transfer serialization, awaits a pre-existing sync, and removes the redundant pre-transfer sync. Database, packages, and Gate remain untouched."

