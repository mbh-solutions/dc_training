schema_version = "1.0"

[behavior]
intended_behavior = "Preserve the owner workflows while requiring online foundation-profile authorization or a matching user-bound authorization persisted by a prior successful query for temporary offline reopening."
proof = "The foundation characterization mounts the real application, represents a prior authorized load for offline reopening, and exercises both profile failure paths; App hides protected UI until the focused profile boundary authorizes the current user."

[characterization]
captured_behavior = "The foundation provides owner authentication, protected profile authorization, the approved Home shell, temporary offline launch, reconnection, and password recovery."
proof = "tests/characterization/foundation-shell.characterization.mjs mounts src/main.tsx through React createRoot, drives real effects, forms, profile-failure paths, and records Supabase-boundary calls while preserving compatible observable behavior."

[separation_of_concerns]
before = "App owned session lifecycle, network listeners, profile authorization, route selection, and Home presentation; the Supabase module also parsed callback URLs."
after = "App only selects screens; focused modules own auth-screen forms, Supabase auth actions, session state, network state, profile authorization, callback parsing, client construction, and Home presentation."

[architecture]
dependency_direction = "src/main.tsx mounts App; App composes AuthScreens, focused hooks, and FoundationHome; AuthScreens delegates client calls to auth-actions; hooks and auth-actions depend on callback parsing or the Supabase client; library modules do not import UI."
reviewed_paths = [
    "src/App.tsx",
    "src/AuthScreens.tsx",
    "src/FoundationHome.tsx",
    "src/hooks/use-auth-session.ts",
    "src/hooks/use-foundation-profile.ts",
    "src/hooks/use-online.ts",
    "src/index.css",
    "src/lib/auth-actions.ts",
    "src/lib/auth-callback.ts",
    "src/lib/supabase.ts",
    "src/main.tsx",
]

[responsibility_boundary]
path = "src/App.tsx"
owns = "Top-level screen selection and composition of focused foundation boundaries."
does_not_own = "Auth forms or client calls, auth lifecycle, network listeners, profile queries, Home presentation, callback parsing, Supabase construction, database policy, or future workout behavior."

[incremental_refactor]
target = "Correct the exact semantic findings without expanding the product scope."
completed_step = "Made profile authorization pending by default, persisted only successful user-bound authorization for offline reopening, extracted auth screens and client actions, and retained focused lifecycle, callback, and Home boundaries."

[review_handoff]
summary = "Review pending-by-default profile authorization, user-bound offline authorization persistence, thin App composition, delegated auth actions, focused dependency direction, and real React characterization."
remaining_risks = [
    "Live Supabase RLS, deployed PWA caching, and iPhone installation remain deployment evidence outside source characterization.",
]

[human_review]
naming = "Each hook and auth action names one concrete responsibility; AuthScreens, FoundationHome, and auth-callback name their direct boundaries."
cohesion = "App composes; AuthScreens owns form presentation and validation; auth-actions owns client workflows; hooks own stateful effects; FoundationHome presents."
intended_behavior = "Owner authentication, recovery, cloud status, authorized offline shell, and Home presentation remain, while unproven or failed authorization hides Home."
reviewability = "The correction maps directly to the captured authorization and mixed-auth-workflow findings and adds no product feature or dependency."

[[module_boundaries]]
path = "src/App.tsx"
owner_path = "src/App.tsx"
basis = "responsibility"
justification = "Owns top-level screen selection and composition only."

[[module_boundaries]]
path = "src/AuthScreens.tsx"
owner_path = "src/AuthScreens.tsx"
basis = "responsibility"
justification = "Owns authentication and recovery form presentation, local form state, and input validation while delegating client workflows."

[[module_boundaries]]
path = "src/FoundationHome.tsx"
owner_path = "src/FoundationHome.tsx"
basis = "responsibility"
justification = "Owns approved Home-shell and network-status presentation only."

[[module_boundaries]]
path = "src/hooks/use-auth-session.ts"
owner_path = "src/hooks/use-auth-session.ts"
basis = "responsibility"
justification = "Owns Supabase session lifecycle and recovery state."

[[module_boundaries]]
path = "src/hooks/use-foundation-profile.ts"
owner_path = "src/hooks/use-foundation-profile.ts"
basis = "responsibility"
justification = "Owns fail-closed foundation-profile authorization, user-bound offline authorization persistence, and cloud status."

[[module_boundaries]]
path = "src/hooks/use-online.ts"
owner_path = "src/hooks/use-online.ts"
basis = "responsibility"
justification = "Owns browser connectivity observation."

[[module_boundaries]]
path = "src/lib/auth-actions.ts"
owner_path = "src/lib/auth-actions.ts"
basis = "responsibility"
justification = "Owns focused Supabase owner-authentication client workflows without UI state or presentation."

[[module_boundaries]]
path = "src/lib/auth-callback.ts"
owner_path = "src/lib/auth-callback.ts"
basis = "responsibility"
justification = "Owns initial authentication callback parsing."

[[module_boundaries]]
path = "src/lib/supabase.ts"
owner_path = "src/lib/supabase.ts"
basis = "responsibility"
justification = "Owns browser-safe Supabase client construction and environment validation."

[[module_boundaries]]
path = "src/main.tsx"
owner_path = "src/main.tsx"
basis = "responsibility"
justification = "Owns React root creation and top-level application mounting."
